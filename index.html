<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Primordial</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="stat" data-kind="organic"><i></i>organics <b>0</b></div>
      <div class="stat" data-kind="lipid"><i></i>lipids <b>0</b></div>
      <div class="stat" data-kind="mineral"><i></i>minerals <b>0</b></div>
      <div class="stat" id="biomass">biomass <b>×1.00</b></div>
      <div id="fps"></div>
    </div>
    <div id="evolve">
      <h1>Evolution</h1>
      <p>Your protocell has gathered enough minerals to change.</p>
      <div class="cards"></div>
    </div>
    <div id="death">
      <h1>Membrane ruptured</h1>
      <p class="cause"></p>
      <p class="stats"></p>
      <p class="again">Tap to begin again</p>
    </div>
    <div id="hint">Hold and drag to swim · WASD on a keyboard</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
